<title>Tradepsy — trading journal</title>

<!-- Installation. A browser only offers to install a page served over http(s);
     opened as a file:// document every one of these is inert and the app runs
     exactly as it always has. All of them sit next to this file. -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Tradepsy" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />

<script>
/* This has to run before anything else on the page, which is why it is up here
   in the head rather than down in the app bundle with the code that uses it.

   `beforeinstallprompt` fires once, early, and is gone if nobody was listening.
   The app below is a ~600KB inline script; a listener registered partway
   through it does not exist until roughly 280KB have been parsed and run. On a
   cold load that is fast enough, but on a warm one — manifest and service
   worker already cached, which is every visit after the first — Chrome fires
   the event before that point and it is lost. The app then reports that no
   install was offered while the browser sits there considering it perfectly
   installable. Nine lines in the head fix a problem no amount of work further
   down could.

   The service worker registration is here for the same reason: the sooner it
   is requested, the sooner it is active, and Chrome wants an active one before
   it will offer anything. */
(function () {
    var S = (window.__tpInstall = {
        event: null, installed: false, sw: "idle", swError: "", swScope: "", manifest: "idle",
    });
    function emit() {
        try { window.dispatchEvent(new CustomEvent("tp-install-state")); } catch (e) {}
    }
    window.addEventListener("beforeinstallprompt", function (e) {
        /* Held, not handled. Without preventDefault the browser shows its own
           chip and the saved event can no longer be prompted with. */
        e.preventDefault();
        S.event = e;
        emit();
    });
    window.addEventListener("appinstalled", function () {
        S.event = null;
        S.installed = true;
        try { localStorage.setItem("tradepsy:installed", "1"); } catch (e) {}
        emit();
    });
    /* An installed app opened in an ordinary tab looks exactly like one that
       was never installed: the prompt does not fire, and display-mode is
       "browser". Remembering the install is the only way to tell the two apart
       and stop the app calling it a failure. */
    try { if (localStorage.getItem("tradepsy:installed") === "1") S.installed = true; } catch (e) {}

    if (location.protocol === "file:") {
        S.sw = "file";
        S.manifest = "file";
        return;
    }
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js", { scope: "./" }).then(function (reg) {
            S.sw = "ready";
            S.swScope = reg.scope;
            emit();
        }, function (err) {
            S.sw = "error";
            S.swError = String((err && err.message) || err);
            emit();
        });
    } else {
        S.sw = "unsupported";
    }
    /* Checked rather than assumed, so the panel can say which piece is missing
       instead of "not offered yet" for every possible reason at once. */
    fetch("manifest.webmanifest", { cache: "no-cache" }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
    }).then(function () {
        S.manifest = "ready";
        emit();
    }).catch(function (err) {
        S.manifest = "error";
        S.manifestError = String((err && err.message) || err);
        emit();
    });
})();
</script>
